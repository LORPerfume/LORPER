<title>هدية عيد الميلاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700&display=swap">
<style>
  /* Layout: full-screen garden canvas, task pill on top, dialog card at the bottom, menus centered */
  :root {
    --blush: #fff1f4;
    --rasp: #d6336c;
    --rasp-deep: #a61e4d;
    --ink: #3b1f2b;
    --muted: #8a5a6b;
    --gold: #f6b93b;
    --card: rgba(255, 241, 244, 0.96);
    --display: "Lalezar", "Tajawal", system-ui, sans-serif;
    --body: "Tajawal", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: #9fd4a0;
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .task {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    margin: 0 auto; max-width: 420px;
    background: var(--card); border-radius: 999px;
    padding: 10px 18px; text-align: center; direction: rtl;
    font-weight: 700; font-size: 1.05rem;
    box-shadow: 0 4px 14px rgba(166, 30, 77, .2);
    pointer-events: none;
  }

  .dialog {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    margin: 0 auto; max-width: 460px;
    background: var(--card); border: 3px solid var(--rasp);
    border-radius: 20px; padding: 16px 18px 12px;
    direction: rtl; cursor: pointer;
    box-shadow: 0 8px 24px rgba(59, 31, 43, .25);
    animation: pop .25s ease-out;
  }
  .dialog p { margin: 0 0 8px; font-size: 1.15rem; line-height: 1.6; }
  .dialog small { color: var(--muted); display: block; text-align: left; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    direction: rtl; text-align: center;
    background: rgba(59, 31, 43, .35);
  }
  .card {
    background: var(--card); border-radius: 26px;
    padding: 28px 22px; width: min(360px, 100%);
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    box-shadow: 0 12px 40px rgba(59, 31, 43, .3);
    animation: pop .35s ease-out;
  }
  .card .emoji { font-size: 3.4rem; line-height: 1; }
  .card h1 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: 1.15; margin: 0; color: var(--rasp); text-wrap: balance; }
  .card p { margin: 0; font-size: 1.1rem; line-height: 1.7; color: var(--ink); }
  .card .from { color: var(--muted); font-size: 1rem; }
  button {
    font-family: var(--display); font-size: 1.4rem;
    background: var(--rasp); color: #fff;
    border: 0; border-radius: 999px; padding: 10px 36px; cursor: pointer;
    box-shadow: 0 5px 0 var(--rasp-deep); transition: transform .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--rasp-deep); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dialog, .card { animation: none; } }
</style>

<canvas id="game"></canvas>

<div class="task" id="task" hidden></div>

<div class="dialog" id="dialog" hidden>
  <p id="dialogText"></p>
  <small>اضغطي للمتابعة ◂</small>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="emoji">🎂</div>
    <h1 id="startTitle"></h1>
    <p>في هدية مستنياكِ آخر الطريق. خلّصي المهام لتوصليلها.</p>
    <button id="startBtn">يلا نبلّش</button>
  </div>
</div>

<div class="overlay" id="finalScreen" hidden>
  <div class="card">
    <div class="emoji">🎁</div>
    <h1 id="finalTitle"></h1>
    <p id="finalMsg"></p>
    <p class="from" id="finalFrom"></p>
    <button id="againBtn">العبي من جديد</button>
  </div>
</div>

<script>
// ================== عدّل هون ==================
const CONFIG = {
  name: 'حبيبتي',
  from: 'من زوجك اللي بحبك ❤️',
  message: 'كل سنة وإنتِ أحلى شي بحياتي. إنتِ الهدية الحقيقية، وهاي اللعبة طريقة صغيرة لأقلك قديش بحبك.',
};
// ==============================================

(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  $('startTitle').textContent = 'عيد ميلاد سعيد يا ' + CONFIG.name;

  // ---------- sound ----------
  let actx = null;
  function tone(freq, start, dur, type = 'triangle', vol = 0.15) {
    if (!actx) return;
    const t = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const ding = () => { tone(880, 0, .15); tone(1320, .08, .2); };
  const success = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .3));
  function happyBirthday() {
    const N = { G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784 };
    const song = [
      ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
      ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
      ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
      ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2],
    ];
    let t = 0.3;
    for (const [n, b] of song) { tone(N[n], t, b * .42, 'triangle', .18); t += b * .42; }
  }

  const faceImg = new Image();
  faceImg.src = 'face.png';

  // ---------- world ----------
  const WW = 1000, WH = 1400;
  const house = { x: 350, y: 60, w: 300, h: 240 };
  const pond = { x: 780, y: 1050, r: 110 };
  const trees = [[100, 350], [900, 430], [250, 600], [720, 700], [110, 820], [890, 850], [370, 1060], [560, 1360], [60, 1150], [940, 1180]]
    .map(([x, y]) => ({ x, y }));
  const rosePos = [[150, 480], [870, 600], [200, 1000], [430, 1250], [880, 1320]];
  const candlePos = [[120, 180], [900, 150], [150, 1330]];
  const fish = { x: 640, y: 990 };
  const cat = { x: 730, y: 370 };
  const cake = { x: 300, y: 770 };
  const gift = { x: 500, y: 380 };

  // deterministic grass decorations
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const decor = Array.from({ length: 140 }, () => ({
    x: rnd() * WW, y: rnd() * WH, k: Math.floor(rnd() * 4)
  })).filter(d => Math.hypot(d.x - pond.x, d.y - pond.y) > pond.r + 10 &&
    !(d.x > house.x - 10 && d.x < house.x + house.w + 10 && d.y < house.y + house.h + 10));

  // ---------- state ----------
  let state, stage, player, roses, candles, hasFish, catFed, cakeLit, time, nearGift;
  const confetti = [];

  function reset() {
    state = 'start'; stage = 0; time = 0;
    player = { x: 500, y: 700, r: 14, face: 1, walk: 0, moving: false };
    roses = rosePos.map(([x, y]) => ({ x, y, taken: false }));
    candles = candlePos.map(([x, y]) => ({ x, y, taken: false }));
    fish.taken = false; hasFish = false; catFed = false; cakeLit = false; nearGift = false;
    confetti.length = 0;
  }
  reset();

  // ---------- dialog ----------
  let queue = [], onDone = null;
  function say(lines, done) {
    queue = [...lines]; onDone = done || null;
    joy.active = false;
    nextLine();
  }
  function nextLine() {
    if (!queue.length) {
      $('dialog').hidden = true;
      const cb = onDone; onDone = null; cb && cb();
      return;
    }
    $('dialogText').textContent = queue.shift();
    $('dialog').hidden = false;
  }
  $('dialog').addEventListener('pointerdown', e => { e.stopPropagation(); nextLine(); });
  const talking = () => !$('dialog').hidden;

  // ---------- tasks ----------
  const countTaken = arr => arr.filter(i => i.taken).length;
  function taskText() {
    if (stage === 1) return `🌹 اجمعي الورود (${countTaken(roses)}/5)`;
    if (stage === 2) return hasFish ? '🐱 ودّي السمكة للقطة' : '🐟 القطة جوعانة! دوّري على سمكة جنب البحيرة';
    if (stage === 3) return countTaken(candles) < 3 ? `🕯️ اجمعي الشموع (${countTaken(candles)}/3)` : '🎂 روحي عالكيكة وولّعي الشموع';
    if (stage === 4) return '🎁 افتحي الهدية قدّام البيت';
    return '';
  }
  function targets() {
    if (stage === 1) return roses.filter(r => !r.taken);
    if (stage === 2) return hasFish ? [cat] : [fish];
    if (stage === 3) return countTaken(candles) < 3 ? candles.filter(c => !c.taken) : [cake];
    if (stage === 4) return [gift];
    return [];
  }
  const updateTask = () => { $('task').textContent = taskText(); };

  function start() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    reset();
    state = 'play';
    $('startScreen').hidden = true; $('finalScreen').hidden = true;
    say([
      `كل عام وإنتِ بخير يا ${CONFIG.name}! 🎉`,
      'في هدية مخبّاية إلك... بس لازم تخلّصي كم مهمة أول 😉',
      'حطي إصبعك على الشاشة واسحبي لتمشي، والسهم الوردي بيدلّك وين تروحي.',
    ], () => { stage = 1; $('task').hidden = false; updateTask(); });
  }
  $('startBtn').onclick = start;
  $('againBtn').onclick = start;

  function finish() {
    state = 'final';
    $('task').hidden = true;
    $('finalTitle').textContent = 'كل عام وإنتِ بخير يا ' + CONFIG.name;
    $('finalMsg').textContent = CONFIG.message;
    $('finalFrom').textContent = CONFIG.from;
    $('finalScreen').hidden = false;
    happyBirthday();
  }

  function checkInteractions() {
    const near = (o, d = 34) => Math.hypot(o.x - player.x, o.y - player.y) < d;

    if (stage === 1) {
      for (const r of roses) if (!r.taken && near(r)) {
        r.taken = true; ding(); burst(r.x, r.y - 20, '#ff6b9a');
        updateTask();
        if (countTaken(roses) === 5) {
          success();
          say(['واو! باقة ورد حلوة متلك 💐', 'بس اسمعي... في قطة جنب البيت شكلها زعلانة. روحي شوفي شو بدها.'],
            () => { stage = 2; updateTask(); });
        }
      }
    } else if (stage === 2) {
      if (!hasFish && near(fish)) { hasFish = true; fish.taken = true; ding(); burst(fish.x, fish.y - 20, '#74c0fc'); updateTask(); }
      if (hasFish && near(cat, 48)) {
        catFed = true; success(); burst(cat.x, cat.y - 30, '#ffd43b');
        say(['مياو! 😻 شكراً عالسمكة!', 'خدي هالمفتاح 🔑 رح تحتاجيه لتفتحي الهدية.', 'بس قبل... الكيكة ناقصها شموع! دوّري على 3 شموع بالجنينة.'],
          () => { stage = 3; updateTask(); });
      }
    } else if (stage === 3) {
      for (const c of candles) if (!c.taken && near(c)) {
        c.taken = true; ding(); burst(c.x, c.y - 20, '#ffd43b'); updateTask();
      }
      if (countTaken(candles) === 3 && near(cake, 50)) {
        cakeLit = true; success(); burst(cake.x, cake.y - 40, '#ffa94d');
        say(['🎂 ولّعنا الشموع!', 'غمّضي عيونك وتمنّي أمنية... ✨', 'هلأ الهدية صارت جاهزة قدّام البيت 🎁'],
          () => { stage = 4; updateTask(); });
      }
    } else if (stage === 4) {
      if (near(gift, 44)) { success(); burst(gift.x, gift.y - 30, '#d6336c'); finish(); }
    }

    const nowNearGift = near(gift, 44);
    if (stage > 0 && stage < 4 && nowNearGift && !nearGift) say(['الهدية مقفولة 🔒 خلّصي المهام أول!']);
    nearGift = nowNearGift;
  }

  // ---------- input: floating joystick + arrow keys ----------
  const joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
  const JR = 50;
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play' || talking()) return;
    Object.assign(joy, { active: true, id: e.pointerId, bx: e.clientX, by: e.clientY, dx: 0, dy: 0 });
  });
  window.addEventListener('pointermove', e => {
    if (!joy.active || e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > JR) { dx *= JR / d; dy *= JR / d; }
    joy.dx = dx; joy.dy = dy;
  });
  const endJoy = e => { if (e.pointerId === joy.id) joy.active = false; };
  window.addEventListener('pointerup', endJoy);
  window.addEventListener('pointercancel', endJoy);
  const keys = {};
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);

  // ---------- physics ----------
  function collide(p) {
    for (const t of trees) pushOut(p, t.x, t.y, 14 + p.r);
    pushOut(p, pond.x, pond.y, pond.r + p.r);
    const cx = Math.max(house.x, Math.min(p.x, house.x + house.w));
    const cy = Math.max(house.y, Math.min(p.y, house.y + house.h));
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (d < p.r) {
      if (d === 0) p.y = house.y + house.h + p.r;
      else { p.x = cx + (p.x - cx) / d * p.r; p.y = cy + (p.y - cy) / d * p.r; }
    }
    p.x = Math.max(p.r, Math.min(WW - p.r, p.x));
    p.y = Math.max(p.r + 20, Math.min(WH - p.r, p.y));
  }
  function pushOut(p, x, y, min) {
    const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy);
    if (d < min && d > 0) { p.x = x + dx / d * min; p.y = y + dy / d * min; }
  }

  // ---------- particles ----------
  const sparks = [];
  function burst(x, y, color) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .7, color });
    }
  }

  function update(dt) {
    time += dt;
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt; s.life -= dt; }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);

    if (state === 'final') {
      if (confetti.length < 160) confetti.push({
        x: Math.random() * W, y: -10, vy: 60 + Math.random() * 80, vx: (Math.random() - .5) * 40,
        r: Math.random() * 6, s: 4 + Math.random() * 5,
        c: ['#d6336c', '#f6b93b', '#74c0fc', '#69db7c', '#b197fc'][Math.floor(Math.random() * 5)]
      });
      for (const c of confetti) { c.y += c.vy * dt; c.x += c.vx * dt; c.r += dt * 4; if (c.y > H + 10) { c.y = -10; c.x = Math.random() * W; } }
    }

    if (state !== 'play' || talking()) { player.moving = false; return; }
    let mx = joy.active ? joy.dx / JR : 0, my = joy.active ? joy.dy / JR : 0;
    if (keys.ArrowLeft) mx = -1; if (keys.ArrowRight) mx = 1;
    if (keys.ArrowUp) my = -1; if (keys.ArrowDown) my = 1;
    const m = Math.hypot(mx, my);
    player.moving = m > 0.15;
    if (player.moving) {
      const sp = 190 * Math.min(1, m);
      player.x += mx / Math.max(1, m) * sp * dt;
      player.y += my / Math.max(1, m) * sp * dt;
      if (Math.abs(mx) > 0.1) player.face = mx > 0 ? 1 : -1;
      player.walk += dt * 10;
      collide(player);
    }
    checkInteractions();
  }

  // ---------- drawing ----------
  function emoji(ch, x, y, size) {
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(ch, x, y);
  }
  function shadow(x, y, w) {
    ctx.fillStyle = 'rgba(40,70,40,.22)';
    ctx.beginPath(); ctx.ellipse(x, y, w, w * .35, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = '#9fd4a0'; ctx.fillRect(0, 0, WW, WH);
    // path from the door
    ctx.fillStyle = '#f3dfc1';
    ctx.beginPath();
    ctx.moveTo(470, house.y + house.h); ctx.lineTo(530, house.y + house.h);
    ctx.quadraticCurveTo(560, 600, 520, 900); ctx.lineTo(460, 900);
    ctx.quadraticCurveTo(500, 600, 470, house.y + house.h);
    ctx.fill();
    for (const d of decor) {
      if (d.k === 0) { ctx.fillStyle = '#8cc58d'; ctx.fillRect(d.x, d.y, 3, 8); ctx.fillRect(d.x + 4, d.y + 2, 3, 6); }
      else { ctx.fillStyle = ['', '#fff', '#ffd6e5', '#ffe066'][d.k]; ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI * 2); ctx.fill(); }
    }
    // pond
    ctx.fillStyle = '#7ec4e8';
    ctx.beginPath(); ctx.arc(pond.x, pond.y, pond.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5fa8d3'; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const r = 20 + ((time * 15 + i * 30) % 90);
      ctx.globalAlpha = 1 - r / 110;
      ctx.beginPath(); ctx.arc(pond.x - 20, pond.y + 10, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHouse() {
    const { x, y, w, h } = house;
    ctx.fillStyle = '#ffe3ea'; ctx.fillRect(x + 20, y + 80, w - 40, h - 80);
    ctx.fillStyle = '#d6336c';
    ctx.beginPath(); ctx.moveTo(x, y + 90); ctx.lineTo(x + w / 2, y); ctx.lineTo(x + w, y + 90); ctx.fill();
    ctx.fillStyle = '#a61e4d'; ctx.fillRect(x + w / 2 - 28, y + h - 70, 56, 70);
    ctx.fillStyle = '#f6b93b'; ctx.beginPath(); ctx.arc(x + w / 2 + 16, y + h - 35, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#bde0fe';
    ctx.fillRect(x + 50, y + 120, 50, 44); ctx.fillRect(x + w - 100, y + 120, 50, 44);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.strokeRect(x + 50, y + 120, 50, 44); ctx.strokeRect(x + w - 100, y + 120, 50, 44);
    // bunting
    const cols = ['#f6b93b', '#74c0fc', '#69db7c', '#b197fc', '#ff8787'];
    for (let i = 0; i < 9; i++) {
      const bx = x + 30 + i * 30, by = y + 96 + Math.sin(i / 8 * Math.PI) * 10;
      ctx.fillStyle = cols[i % 5];
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 24, by); ctx.lineTo(bx + 12, by + 18); ctx.fill();
    }
    // balloons
    [[x - 10, '#ff6b9a'], [x + w + 10, '#74c0fc'], [x + w + 30, '#ffd43b']].forEach(([bx, c], i) => {
      const sway = Math.sin(time * 1.5 + i) * 6, top = y + 40 + i * 12;
      ctx.strokeStyle = '#8a5a6b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(bx, y + h); ctx.quadraticCurveTo(bx + sway, top + 80, bx + sway, top + 28); ctx.stroke();
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(bx + sway, top, 20, 26, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(bx + sway - 7, top - 9, 5, 8, -.4, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawTree(t) {
    shadow(t.x, t.y, 30);
    ctx.fillStyle = '#8d5b3e'; ctx.fillRect(t.x - 7, t.y - 30, 14, 32);
    ctx.fillStyle = '#4f9d5b';
    ctx.beginPath(); ctx.arc(t.x, t.y - 58, 36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#62b56e';
    ctx.beginPath(); ctx.arc(t.x - 12, t.y - 68, 20, 0, Math.PI * 2); ctx.fill();
  }

  function drawGirl() {
    const { x, y, face, walk, moving } = player;
    const step = moving ? Math.sin(walk) : 0;
    const bob = moving ? Math.abs(Math.sin(walk)) * 2 : Math.sin(time * 2) * .8;
    shadow(x, y, 16);
    ctx.save(); ctx.translate(x, y - bob); ctx.scale(face, 1);
    // shoes peeking under the long dress
    ctx.fillStyle = '#3b1f2b';
    ctx.fillRect(-8 + step * 3, -4, 7, 4); ctx.fillRect(1 - step * 3, -4, 7, 4);
    // hijab drape over the shoulders
    ctx.fillStyle = '#d8cfc4';
    ctx.beginPath(); ctx.moveTo(-12, -48); ctx.lineTo(12, -48); ctx.lineTo(15, -30); ctx.lineTo(-15, -30); ctx.closePath(); ctx.fill();
    // white dress
    ctx.fillStyle = '#fbf8f4';
    ctx.beginPath(); ctx.moveTo(-10, -36); ctx.lineTo(10, -36); ctx.lineTo(15 + step * 1.5, -3); ctx.lineTo(-15 + step * 1.5, -3); ctx.closePath(); ctx.fill();
    // black open jacket
    ctx.fillStyle = '#1f1a24';
    ctx.beginPath(); ctx.moveTo(-13, -38); ctx.lineTo(-4, -38); ctx.lineTo(-6, -10); ctx.lineTo(-15, -10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(13, -38); ctx.lineTo(4, -38); ctx.lineTo(6, -10); ctx.lineTo(15, -10); ctx.closePath(); ctx.fill();
    // arms
    ctx.strokeStyle = '#1f1a24'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, -35); ctx.lineTo(-15 - step * 2, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -35); ctx.lineTo(15 + step * 2, -20); ctx.stroke();
    ctx.fillStyle = '#f2cdb4';
    ctx.beginPath(); ctx.arc(-15 - step * 2, -17, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(15 + step * 2, -17, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // head: her photo, never mirrored
    if (faceImg.complete && faceImg.naturalWidth) {
      ctx.drawImage(faceImg, x - 19, y - bob - 84, 38, 55);
    } else {
      ctx.fillStyle = '#d8cfc4';
      ctx.beginPath(); ctx.ellipse(x, y - bob - 57, 18, 26, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2cdb4';
      ctx.beginPath(); ctx.ellipse(x, y - bob - 54, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
    }
    // carried items
    if (hasFish && !catFed) emoji('🐟', x + 16 * face, y - 20 - bob, 18);
  }

  function drawItem(ch, o, size = 28) {
    const b = Math.sin(time * 3 + o.x) * 3;
    shadow(o.x, o.y, 10);
    emoji(ch, o.x, o.y - 4 + b, size);
  }

  function drawCat() {
    shadow(cat.x, cat.y, 14);
    emoji(catFed ? '😻' : '🐱', cat.x, cat.y + 2, 34);
    if (stage === 2 && !catFed) {
      const b = Math.sin(time * 2) * 2;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(cat.x + 20, cat.y - 58 + b, 20, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cat.x + 8, cat.y - 38 + b, 4, 0, Math.PI * 2); ctx.fill();
      emoji('🐟', cat.x + 20, cat.y - 47 + b, 18);
    }
  }

  function drawCake() {
    shadow(cake.x, cake.y, 26);
    ctx.fillStyle = '#c08552'; ctx.fillRect(cake.x - 28, cake.y - 22, 56, 8);
    ctx.fillRect(cake.x - 22, cake.y - 14, 5, 14); ctx.fillRect(cake.x + 17, cake.y - 14, 5, 14);
    if (cakeLit) {
      const g = ctx.createRadialGradient(cake.x, cake.y - 50, 4, cake.x, cake.y - 50, 50);
      g.addColorStop(0, 'rgba(255,212,59,.55)'); g.addColorStop(1, 'rgba(255,212,59,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cake.x, cake.y - 50, 50, 0, Math.PI * 2); ctx.fill();
    }
    emoji('🎂', cake.x, cake.y - 18, 40);
  }

  function drawGift() {
    const pulse = stage === 4 ? 1 + Math.sin(time * 5) * .08 : 1;
    shadow(gift.x, gift.y, 20);
    if (stage === 4) {
      const g = ctx.createRadialGradient(gift.x, gift.y - 22, 4, gift.x, gift.y - 22, 60);
      g.addColorStop(0, 'rgba(255,107,154,.5)'); g.addColorStop(1, 'rgba(255,107,154,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gift.x, gift.y - 22, 60, 0, Math.PI * 2); ctx.fill();
    }
    emoji('🎁', gift.x, gift.y + 2, 42 * pulse);
    if (stage < 4) emoji('🔒', gift.x + 18, gift.y - 26, 18);
  }

  function drawArrow() {
    const ts = targets();
    if (!ts.length || talking()) return;
    let best = null, bd = Infinity;
    for (const t of ts) { const d = Math.hypot(t.x - player.x, t.y - player.y); if (d < bd) { bd = d; best = t; } }
    if (bd < 70) return;
    const a = Math.atan2(best.y - player.y, best.x - player.x);
    const r = 46 + Math.sin(time * 6) * 4;
    ctx.save();
    ctx.translate(player.x + Math.cos(a) * r, player.y - 30 + Math.sin(a) * r);
    ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, 0); ctx.lineTo(-8, 9); ctx.closePath();
    ctx.fillStyle = '#d6336c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.stroke(); ctx.fill();
    ctx.restore();
  }

  function draw() {
    const camX = WW > W ? Math.max(0, Math.min(WW - W, player.x - W / 2)) : (WW - W) / 2;
    const camY = WH > H ? Math.max(0, Math.min(WH - H, player.y - H / 2)) : (WH - H) / 2;
    ctx.fillStyle = '#9fd4a0'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(-camX, -camY);
    drawGround();
    drawHouse();

    const list = trees.map(t => ({ y: t.y, f: () => drawTree(t) }));
    list.push({ y: player.y, f: drawGirl });
    list.push({ y: cat.y, f: drawCat });
    list.push({ y: cake.y, f: drawCake });
    list.push({ y: gift.y, f: drawGift });
    if (stage === 1) roses.forEach(r => !r.taken && list.push({ y: r.y, f: () => drawItem('🌹', r) }));
    if (stage === 2 && !fish.taken) list.push({ y: fish.y, f: () => drawItem('🐟', fish) });
    if (stage === 3) candles.forEach(c => !c.taken && list.push({ y: c.y, f: () => drawItem('🕯️', c) }));
    list.sort((a, b) => a.y - b.y).forEach(o => o.f());

    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life / .7); ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (state === 'play') drawArrow();
    ctx.restore();

    if (joy.active) {
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.bx, joy.by, JR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(214,51,108,.8)';
      ctx.beginPath(); ctx.arc(joy.bx + joy.dx, joy.by + joy.dy, 22, 0, Math.PI * 2); ctx.fill();
    }

    for (const c of confetti) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
      ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2);
      ctx.restore();
    }
  }

  let last = 0;
  function loop(t) {
    const dt = Math.min(0.033, (t - (last || t)) / 1000);
    last = t;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

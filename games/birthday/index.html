<title>مدينة الياسمين</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Lalezar&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/game.css">

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <!-- HUD -->
  <div id="hud" hidden>
    <button id="minimapBtn" class="minimap" aria-label="الخريطة"><canvas id="minimap" width="240" height="240"></canvas></button>
    <div class="topbar">
      <button class="icon" id="btnPause" aria-label="القائمة">☰</button>
      <button class="icon" id="btnQuests" aria-label="المهام">📜</button>
      <button class="icon" id="btnBag" aria-label="الحقيبة">🎒</button>
      <button class="icon" id="btnAlbum" aria-label="الألبوم">📸</button>
    </div>
    <button id="tracker" class="tracker">
      <span class="tk-title" id="trackerTitle"></span>
      <span class="tk-obj" id="trackerObj"></span>
    </button>
    <div id="timerHud" class="timer-hud" hidden><span id="timerLabel"></span><b id="timerValue"></b></div>
    <div class="controls-r">
      <button id="runBtn" class="run" aria-label="ركض">🏃‍♀️<small>ركض</small></button>
      <button id="actionBtn" class="action" hidden><span id="actionIcon">✋</span><small id="actionLabel"></small></button>
    </div>
    <div id="zoneTitle" class="zone-title" hidden></div>
  </div>

  <div id="toasts" class="toasts"></div>

  <!-- dialog -->
  <div id="dialog" class="dialog" hidden>
    <div class="dlg-who" id="dlgWho"></div>
    <p class="dlg-text" id="dlgText"></p>
    <div class="dlg-choices" id="dlgChoices"></div>
    <div class="dlg-foot"><button id="dlgSkip" class="link">تخطّي</button><button id="dlgNext" class="next">التالي ◂</button></div>
  </div>

  <!-- panels -->
  <div id="panelWrap" class="panel-wrap" hidden>
    <div class="panel" role="dialog" aria-modal="true">
      <header><h2 id="panelTitle"></h2><button class="icon close" id="panelClose" aria-label="إغلاق">✕</button></header>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <!-- mini-games -->
  <div id="mini" class="mini" hidden>
    <div class="mini-card">
      <header><h2 id="miniTitle"></h2><button class="icon close" id="miniClose" aria-label="إغلاق">✕</button></header>
      <div id="miniBody" class="mini-body"></div>
    </div>
  </div>

  <!-- cinematic -->
  <div id="bars" class="bars" hidden><i></i><i></i></div>
  <div id="cine" class="cine" hidden></div>
  <div id="fade" class="fade"></div>

  <!-- start -->
  <div id="startScreen" class="screen start" hidden>
    <div class="start-card">
      <img class="portrait" id="startPortrait" alt="">
      <div class="start-text">
        <p class="eyebrow" id="startCity"></p>
        <h1 id="startTitle"></h1>
        <p class="sub" id="startSub"></p>
        <div class="btns">
          <button class="primary" id="btnContinue" hidden>متابعة</button>
          <button class="primary" id="btnNew">لعبة جديدة</button>
          <button class="ghost" id="btnStartSettings">الإعدادات</button>
        </div>
        <p class="note" id="saveNote"></p>
      </div>
    </div>
  </div>

  <!-- ending -->
  <div id="ending" class="screen ending" hidden>
    <div class="end-card">
      <figure><img id="giftImg" alt="الهدية"><figcaption id="giftCaption"></figcaption></figure>
      <div class="end-text">
        <h1 id="endTitle"></h1>
        <p id="endMsg"></p>
        <p class="sig" id="endSig"></p>
        <div class="btns">
          <button class="primary" id="btnReplay">إعادة النهاية</button>
          <button class="ghost" id="btnFullLetter">الخطاب الكامل</button>
          <button class="ghost" id="btnEndClose">متابعة الاستكشاف</button>
        </div>
      </div>
    </div>
  </div>

  <div id="loading" class="screen loading"><div class="spinner"></div><p>عم نجهّز المدينة…</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
